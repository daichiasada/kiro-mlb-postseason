<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#1a2029">MLB Postseason Summary Site &#8212; Architecture</text>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <!-- AWS Account boundary -->
  <rect x="300" y="90" width="760" height="560" rx="12" fill="#fcfbf8" stroke="#D79B00" stroke-width="1.8" stroke-dasharray="8 5"/>
  <text x="314" y="112" font-size="13" font-weight="700" fill="#8a6d00">AWS Account 051826704233 (us-east-1)</text>
  <text x="314" y="130" font-size="11.5" fill="#8a6d00">CloudFormation stack: MlbPostseasonStack</text>

  <!-- Client -->
  <rect x="50" y="150" width="170" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="135" y="182" font-size="14" font-weight="600" fill="#1a2029" text-anchor="middle">User (Web Browser)</text>
  <text x="135" y="202" font-size="12" fill="#334" text-anchor="middle">EN / JA</text>

  <!-- CloudFront -->
  <rect x="360" y="150" width="78" height="78" rx="8" fill="#8C4FFF" stroke="#ffffff" stroke-width="1.5"/>
  <text x="399" y="194" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">CloudFront</text>
  <text x="399" y="244" font-size="10.5" fill="#232F3E" text-anchor="middle">Amazon CloudFront</text>
  <text x="399" y="260" font-size="9.5" fill="#334" text-anchor="middle">REDIRECT_TO_HTTPS, OAC</text>
  <text x="399" y="274" font-size="9.5" fill="#334" text-anchor="middle">SPA 403/404 -&gt; /index.html</text>

  <!-- S3 -->
  <rect x="360" y="320" width="78" height="78" rx="8" fill="#277116" stroke="#ffffff" stroke-width="1.5"/>
  <text x="399" y="364" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">S3</text>
  <text x="399" y="414" font-size="10.5" fill="#232F3E" text-anchor="middle">Amazon S3 (private)</text>
  <text x="399" y="430" font-size="9.5" fill="#334" text-anchor="middle">SPA bundle + deploy-time /config.js</text>
  <text x="399" y="444" font-size="9.5" fill="#334" text-anchor="middle">Block Public Access</text>

  <!-- API Gateway -->
  <rect x="610" y="150" width="78" height="78" rx="8" fill="#BC1356" stroke="#ffffff" stroke-width="1.5"/>
  <text x="649" y="186" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">API</text>
  <text x="649" y="200" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Gateway</text>
  <text x="649" y="244" font-size="10.5" fill="#232F3E" text-anchor="middle">Amazon API Gateway (HTTP API, CORS)</text>
  <text x="649" y="260" font-size="9.5" fill="#334" text-anchor="middle">GET /bracket; GET+POST /prediction</text>

  <!-- Lambda getBracket -->
  <rect x="610" y="320" width="78" height="78" rx="8" fill="#D05C17" stroke="#ffffff" stroke-width="1.5"/>
  <text x="649" y="364" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Lambda</text>
  <text x="649" y="414" font-size="10.5" fill="#232F3E" text-anchor="middle">getBracket</text>
  <text x="649" y="430" font-size="9.5" fill="#334" text-anchor="middle">Node 20, 256MB / 15s</text>

  <!-- Lambda getPrediction -->
  <rect x="610" y="500" width="78" height="78" rx="8" fill="#D05C17" stroke="#ffffff" stroke-width="1.5"/>
  <text x="649" y="544" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Lambda</text>
  <text x="649" y="594" font-size="10.5" fill="#232F3E" text-anchor="middle">getPrediction</text>
  <text x="649" y="610" font-size="9.5" fill="#334" text-anchor="middle">Node 20, 512MB / 30s</text>

  <!-- DynamoDB -->
  <rect x="900" y="320" width="78" height="78" rx="8" fill="#3334B9" stroke="#ffffff" stroke-width="1.5"/>
  <text x="939" y="364" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">DynamoDB</text>
  <text x="939" y="414" font-size="10.5" fill="#232F3E" text-anchor="middle">Amazon DynamoDB</text>
  <text x="939" y="430" font-size="9.5" fill="#334" text-anchor="middle">BracketCacheTable, PAY_PER_REQUEST</text>
  <text x="939" y="444" font-size="9.5" fill="#334" text-anchor="middle">pk, TTL on ttl (~15min)</text>

  <!-- Bedrock -->
  <rect x="900" y="500" width="78" height="78" rx="8" fill="#01A88D" stroke="#ffffff" stroke-width="1.5"/>
  <text x="939" y="544" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Bedrock</text>
  <text x="939" y="594" font-size="10.5" fill="#232F3E" text-anchor="middle">Amazon Bedrock (InvokeModel)</text>
  <text x="939" y="610" font-size="8.5" fill="#334" text-anchor="middle">us.anthropic.claude-haiku-4-5-20251001-v1:0</text>
  <text x="939" y="623" font-size="8.5" fill="#334" text-anchor="middle">cross-region profile; deterministic fallback</text>

  <!-- External: MLB Stats API -->
  <rect x="900" y="150" width="150" height="80" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="975" y="182" font-size="12" font-weight="600" fill="#1a2029" text-anchor="middle">MLB Stats API</text>
  <text x="975" y="200" font-size="10.5" fill="#334" text-anchor="middle">statsapi.mlb.com</text>
  <text x="975" y="216" font-size="10.5" fill="#334" text-anchor="middle">public, no key</text>

  <!-- External: CDK IaC -->
  <rect x="50" y="560" width="190" height="90" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="145" y="592" font-size="12" font-weight="600" fill="#1a2029" text-anchor="middle">AWS CDK (TypeScript)</text>
  <text x="145" y="610" font-size="10.5" fill="#334" text-anchor="middle">infra/ — one-command deploy</text>
  <text x="145" y="626" font-size="10.5" fill="#334" text-anchor="middle">MlbPostseasonStack</text>

  <!-- Edges -->
  <!-- Browser -> CloudFront -->
  <line x1="220" y1="178" x2="358" y2="178" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="170" font-size="10" fill="#4a4a4a">HTTPS</text>

  <!-- CloudFront -> S3 -->
  <line x1="399" y1="228" x2="399" y2="318" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="406" y="278" font-size="10" fill="#4a4a4a">OAC: static SPA + /config.js</text>

  <!-- Browser -> API Gateway -->
  <path d="M135,230 L135,280 L608,280 L608,210" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="296" font-size="10" fill="#4a4a4a">fetch /bracket, /prediction</text>

  <!-- API Gateway -> getBracket -->
  <line x1="649" y1="228" x2="649" y2="318" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="656" y="276" font-size="10" fill="#4a4a4a">GET /bracket</text>

  <!-- API Gateway -> getPrediction -->
  <path d="M688,189 L760,189 L760,539 L690,539" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="768" y="360" font-size="10" fill="#4a4a4a">GET+POST</text>
  <text x="768" y="374" font-size="10" fill="#4a4a4a">/prediction</text>

  <!-- getBracket -> DynamoDB -->
  <line x1="688" y1="359" x2="898" y2="359" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="730" y="351" font-size="10" fill="#4a4a4a">cache read/write</text>

  <!-- getBracket -> MLB Stats API -->
  <path d="M680,320 L680,250 L899,215" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="700" y="258" font-size="10" fill="#4a4a4a">cache miss: fetch + aggregate (seed fallback 2024/2025)</text>

  <!-- getPrediction -> DynamoDB -->
  <path d="M688,520 L820,520 L820,398" fill="none" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="726" y="512" font-size="10" fill="#4a4a4a">reads bracket (same cache/MLB path)</text>

  <!-- getPrediction -> Bedrock -->
  <line x1="688" y1="539" x2="898" y2="539" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="724" y="531" font-size="10" fill="#4a4a4a">InvokeModel (narrative)</text>

  <!-- CDK -> AWS boundary -->
  <path d="M240,590 L270,590 L270,650 L430,650" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="290" y="642" font-size="10" fill="#4a4a4a">provisions</text>
</svg>
